name: Website checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:slope
      - run: npm run test:line-equations
      - run: npm run test:graph-line
      - run: npm run test:standard-form
      - run: node --experimental-strip-types scripts/test-standard-slope.mjs
      - run: node --experimental-strip-types scripts/test-multiplication.mjs
      - run: node scripts/test-2048.mjs
      - run: node scripts/test-function-families.mjs
      - run: npm run test:mathboard
      - run: npm run check:content
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node scripts/test-slope-api.mjs
      - run: node scripts/test-mathboard-api.mjs
