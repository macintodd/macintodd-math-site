name: Website checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/test-transformations.mjs
      - run: node --experimental-strip-types scripts/test-transformations-flow.mjs
      - run: node --experimental-strip-types scripts/test-point-slope.mjs
      - run: node --experimental-strip-types scripts/test-point-slope-flow.mjs
      - run: node --experimental-strip-types scripts/test-mixed-graph.mjs
      - run: node --experimental-strip-types scripts/test-mixed-graph-flow.mjs
      - run: node --experimental-strip-types scripts/test-slope-read-entries.mjs
      - run: node --experimental-strip-types scripts/test-intro-point-slope.mjs
      - run: node --experimental-strip-types scripts/test-intro-point-slope-flow.mjs
      - run: node --experimental-strip-types scripts/test-point-slope-celebration.mjs
      - run: node --experimental-strip-types scripts/test-point-slope-celebration-flow.mjs
      - run: node --experimental-strip-types scripts/test-point-slope-reflection.mjs
      - run: npm run test:slope
      - run: node --experimental-strip-types scripts/test-line-equation-levels.mjs
      - run: node --experimental-strip-types scripts/test-line-equation-flow.mjs
      - run: npm run test:line-equations
      - run: npm run test:graph-line
      - run: npm run test:standard-form
      - run: node --experimental-strip-types scripts/test-standard-slope.mjs
      - run: node --experimental-strip-types scripts/test-multiplication.mjs
      - run: node --experimental-strip-types scripts/test-multiplication-flow.mjs
      - run: node scripts/test-2048.mjs
      - run: node scripts/test-scratch-pad.mjs
      - run: node --experimental-strip-types scripts/test-function-evaluation.mjs
      - run: node --experimental-strip-types scripts/test-function-evaluation-flow.mjs
      - run: node scripts/test-function-families.mjs
      - run: npm run test:mathboard
      - run: node --experimental-strip-types scripts/test-app-directory.mjs
      - run: node --experimental-strip-types scripts/test-app-previews.mjs
      - run: node --experimental-strip-types scripts/test-transformation-notation.mjs
      - run: node --experimental-strip-types scripts/test-transformation-notation-flow.mjs
      - run: npm run check:content
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node scripts/test-slope-api.mjs
      - run: node scripts/test-mathboard-api.mjs
